<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Verdictly - Honest Reviews on Everything{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="{{ url_for('main.index') }}" class="logo">
        <span class="logo-icon">⭐</span>
        <span class="logo-text">Verdictly</span>
      </a>
      <nav class="main-nav">
        <a href="{{ url_for('main.index') }}">Home</a>
        <a href="{{ url_for('main.category', category_slug='animals') }}">Animals</a>
      </nav>
    </div>
  </header>

  {% if breadcrumbs is defined and breadcrumbs %}
  <div class="breadcrumb-bar">
    <div class="container">
      <nav class="breadcrumbs" aria-label="breadcrumb">
        <a href="{{ url_for('main.index') }}">Home</a>
        {% for crumb in breadcrumbs %}
          <span class="sep">›</span>
          {% if crumb.url %}
            <a href="{{ crumb.url }}">{{ crumb.label }}</a>
          {% else %}
            <span class="current">{{ crumb.label }}</span>
          {% endif %}
        {% endfor %}
      </nav>
    </div>
  </div>
  {% endif %}

  <main class="main-content">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 Verdictly. Real reviews on everything.</p>
    </div>
  </footer>
</body>
</html>
