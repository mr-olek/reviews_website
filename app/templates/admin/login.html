<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Verdictly</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="admin-body login-page">
  <div class="login-card">
    <div class="login-logo">⭐</div>
    <h1 class="login-title">Admin Login</h1>
    <p class="login-sub">Verdictly administration</p>

    {% if error %}
    <div class="flash flash-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="login-form">
      <label class="form-label" for="username">Username</label>
      <input type="text" id="username" name="username" class="form-input"
             placeholder="Enter username" autofocus required autocomplete="username">
      <label class="form-label" for="password" style="margin-top:14px">Password</label>
      <input type="password" id="password" name="password" class="form-input"
             placeholder="Enter password" required autocomplete="current-password">
      <button type="submit" class="btn-primary" style="width:100%;margin-top:16px;padding:12px">
        Sign in
      </button>
    </form>
    <div class="login-back">
      <a href="{{ url_for('main.index') }}">← Back to site</a>
    </div>
  </div>
</body>
</html>
